<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Wall - Catholic Youth Society</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="192x192" href="logo-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="logo-192.png">
    <meta name="theme-color" content="#121b2d">

    <style>
        :root {
            --navy-dark: #080d1a;
            --navy-card: #121b2d;
            --navy-accent: #1e2d4a;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --text-white: #ffffff;
            --text-muted: #8c9ba5;
            --border-gold: rgba(212, 175, 55, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            color: var(--text-white);
            background-color: var(--navy-dark);
            line-height: 1.6;
            padding-top: env(safe-area-inset-top);
            padding-bottom: calc(5rem + env(safe-area-inset-bottom));
        }

        .container {
            padding: 1.5rem 5%;
            max-width: 800px;
            margin: 0 auto;
        }

        .section-title {
            color: var(--gold-primary);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .card {
            background-color: var(--navy-card);
            border: 1px solid var(--border-gold);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        input[type="text"], textarea {
            width: 100%;
            background-color: rgba(8, 13, 26, 0.6);
            border: 1px solid var(--border-gold);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-white);
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .btn-submit {
            background-color: var(--gold-primary);
            color: var(--navy-dark);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        .btn-pray {
            background: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 0.4rem 1.1rem;
            border-radius: 20px;
            cursor: pointer;
        }

        .btn-pray.prayed {
            background: var(--gold-primary);
            color: var(--navy-dark);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--navy-card);
            border-top: 1px solid var(--border-gold);
            display: flex;
            justify-content: space-around;
            padding: 0.6rem 0;
            z-index: 1000;
            padding-bottom: max(0.6rem, env(safe-area-inset-bottom));
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
        }

        .nav-item.active, .nav-item:hover { color: var(--gold-primary); }
    </style>
</head>
<body>

    <main class="container">
        <div style="margin-bottom: 1.5rem;">
            <div class="section-title">Community Intentions</div>
            <h1 style="font-size: 2rem;">Prayer Wall</h1>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 1rem;">Post an Intention</h3>
            <form id="prayerForm" onsubmit="handleFormSubmit(event)">
                <input type="text" id="authorInput" placeholder="Your Name or Anonymous" required>
                <textarea id="intentionInput" rows="3" placeholder="Prayer Request..." required></textarea>
                <button type="submit" class="btn-submit">Post Prayer Intention</button>
            </form>
        </div>

        <div id="prayerFeed"></div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span style="font-size: 1.25rem;">🏠</span>
            <span>Home</span>
        </a>
        <a href="daily-prayer.html" class="nav-item">
            <span style="font-size: 1.25rem;">📖</span>
            <span>Prayers</span>
        </a>
        <a href="prayer-wall.html" class="nav-item active">
            <span style="font-size: 1.25rem;">🙏</span>
            <span>Prayer Wall</span>
        </a>
        <a href="events.html" class="nav-item">
            <span style="font-size: 1.25rem;">📅</span>
            <span>Events</span>
        </a>
    </nav>

    <script>
        const defaultPrayers = [
            { id: 1, author: "Sarah M.", text: "Pray for my exams this week.", prays: 12, prayedByUser: false }
        ];

        function getPrayers() {
            const stored = localStorage.getItem('cys_prayer_wall');
            return stored ? JSON.parse(stored) : defaultPrayers;
        }

        function savePrayers(prayers) {
            localStorage.setItem('cys_prayer_wall', JSON.stringify(prayers));
        }

        function renderFeed() {
            const prayers = getPrayers();
            const feed = document.getElementById('prayerFeed');
            feed.innerHTML = '';

            prayers.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div style="font-weight: 700; color: var(--gold-light);">${item.author}</div>
                    <p style="margin: 0.5rem 0;">${item.text}</p>
                    <button class="btn-pray ${item.prayedByUser ? 'prayed' : ''}" onclick="togglePray(${item.id})">
                        ${item.prayedByUser ? '✓ Prayed' : '🙏 I Prayed (' + item.prays + ')'}
                    </button>
                `;
                feed.appendChild(card);
            });
        }

        function togglePray(id) {
            const prayers = getPrayers();
            const target = prayers.find(p => p.id === id);
            if (target) {
                target.prayedByUser = !target.prayedByUser;
                target.prays += target.prayedByUser ? 1 : -1;
                savePrayers(prayers);
                renderFeed();
            }
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const author = document.getElementById('authorInput').value;
            const text = document.getElementById('intentionInput').value;
            const prayers = getPrayers();

            prayers.unshift({ id: Date.now(), author, text, prays: 1, prayedByUser: true });
            savePrayers(prayers);
            document.getElementById('prayerForm').reset();
            renderFeed();
        }

        renderFeed();
    </script>
</body>
</html>
