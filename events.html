<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events & Calendar - Catholic Youth Society</title>
    <style>
        :root {
            --navy-dark: #080d1a;
            --navy-card: #121b2d;
            --navy-accent: #1e2d4a;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --text-white: #ffffff;
            --text-muted: #8c9ba5;
            --border-gold: rgba(212, 175, 55, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            color: var(--text-white);
            background-color: var(--navy-dark);
            line-height: 1.6;
            padding-bottom: 5rem;
        }

        .container {
            padding: 2rem 5%;
            max-width: 900px;
            margin: 0 auto;
        }

        .section-title {
            color: var(--gold-primary);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        h1, h2, h3, h4 {
            font-family: Georgia, serif;
            color: var(--text-white);
        }

        .card {
            background-color: var(--navy-card);
            border: 1px solid var(--border-gold);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        /* Event Card Styles */
        .event-card {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            position: relative;
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background-color: rgba(212, 175, 55, 0.15);
            color: var(--gold-light);
            border: 1px solid var(--border-gold);
        }

        .event-meta {
            font-size: 0.85rem;
            color: var(--gold-light);
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 0.25rem;
        }

        .event-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 0.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-action:hover, .btn-action.active {
            background: var(--gold-primary);
            color: var(--navy-dark);
        }

        .btn-delete {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 0.3rem 0.7rem;
            border-radius: 12px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        /* Forms */
        .admin-panel {
            display: none;
            border-left: 4px solid var(--gold-primary);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--gold-light);
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea {
            width: 100%;
            background-color: rgba(8, 13, 26, 0.6);
            border: 1px solid var(--border-gold);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-white);
            font-size: 0.95rem;
            outline: none;
        }

        .grid-2-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn-submit {
            background-color: var(--gold-primary);
            color: var(--navy-dark);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
        }

        /* RSVP Collapsible Section */
        .rsvp-section {
            display: none;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px dashed rgba(212, 175, 55, 0.3);
            background: rgba(8, 13, 26, 0.4);
            padding: 1rem;
            border-radius: 8px;
        }

        .rsvp-section.open {
            display: block;
        }

        .admin-toggle-link {
            display: block;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-decoration: none;
            margin-top: 3rem;
            cursor: pointer;
        }

        /* Bottom Nav Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--navy-card);
            border-top: 1px solid var(--border-gold);
            display: flex;
            justify-content: space-around;
            padding: 0.6rem 0;
            z-index: 1000;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.5);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .nav-item .nav-icon {
            font-size: 1.25rem;
            margin-bottom: 0.15rem;
        }

        .nav-item.active,
        .nav-item:hover {
            color: var(--gold-primary);
        }

        @media (max-width: 600px) {
            .grid-2-form { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <main class="container">

        <div style="margin-bottom: 1.5rem;">
            <div class="section-title">Schedule & Gatherings</div>
            <h1 style="font-size: 2rem;">Upcoming Events</h1>
            <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem;">
                Join our Bible studies, virtual prayer sessions, and youth game nights.
            </p>
        </div>

        <!-- Admin Event Creation Panel (Hidden unless unlocked) -->
        <div class="card admin-panel" id="adminPanel">
            <div class="section-title">Admin Controls</div>
            <h3 style="margin-bottom: 1rem;">Post New Event</h3>

            <form id="eventForm" onsubmit="handleCreateEvent(event)">
                <div class="form-group">
                    <label for="titleInput">Event Title</label>
                    <input type="text" id="titleInput" placeholder="e.g., Youth Game Night & Fellowship" required>
                </div>

                <div class="grid-2-form">
                    <div class="form-group">
                        <label for="typeInput">Event Category / Type</label>
                        <input type="text" id="typeInput" placeholder="e.g., Virtual, In-Person, Retreat, Service" required>
                    </div>

                    <div class="form-group">
                        <label for="dateInput">Date & Time</label>
                        <input type="text" id="dateInput" placeholder="e.g., Friday, Sept 18 • 7:00 PM EST" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="locationInput">Location / Meeting Details</label>
                    <input type="text" id="locationInput" placeholder="e.g., Parish Youth Center or Zoom Link" required>
                </div>

                <div class="form-group">
                    <label for="descInput">Event Details</label>
                    <textarea id="descInput" rows="3" placeholder="Brief description of the event..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Publish Event</button>
            </form>
        </div>

        <!-- Public Events Feed -->
        <div class="section-title">Calendar Feed</div>
        <div id="eventsFeed">
            <!-- Rendered dynamically -->
        </div>

        <!-- Footer Admin Trigger -->
        <a class="admin-toggle-link" id="adminAuthBtn" onclick="toggleAdminPrompt()">🔑 Admin Access (Post Events)</a>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="daily-prayer.html" class="nav-item">
            <span class="nav-icon">📖</span>
            <span>Prayers</span>
        </a>
        <a href="prayer-wall.html" class="nav-item">
            <span class="nav-icon">🙏</span>
            <span>Prayer Wall</span>
        </a>
        <a href="events.html" class="nav-item active">
            <span class="nav-icon">📅</span>
            <span>Events</span>
        </a>
    </nav>

    <script>
        const ADMIN_PASSCODE = "722005";

        const defaultEvents = [
            {
                id: 1,
                title: "National Youth Virtual Rosary",
                type: "Virtual",
                dateStr: "Friday, Sept 11 • 8:00 PM EST",
                location: "Zoom ID: 842 1920 4410",
                description: "Join youth from across the country for our weekly online Rosary and small group discussion."
            },
            {
                id: 2,
                title: "Game Night & Pizza Social",
                type: "In-Person",
                dateStr: "Saturday, Sept 19 • 6:00 PM EST",
                location: "St. Joseph Youth Center Hall",
                description: "Board games, multiplayer video games, and free pizza! Bring a friend along."
            }
        ];

        function getEvents() {
            const stored = localStorage.getItem('cys_events');
            if (!stored) {
                localStorage.setItem('cys_events', JSON.stringify(defaultEvents));
                return defaultEvents;
            }
            return JSON.parse(stored);
        }

        function saveEvents(events) {
            localStorage.setItem('cys_events', JSON.stringify(events));
        }

        function isAdmin() {
            return localStorage.getItem('cys_admin_logged_in') === 'true';
        }

        function renderEvents() {
            const events = getEvents();
            const feed = document.getElementById('eventsFeed');
            const adminLoggedIn = isAdmin();
            
            feed.innerHTML = '';

            events.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card event-card';
                
                // Retrieve RSVPs for this event
                const rsvpKey = `cys_rsvp_${item.id}`;
                const userRsvp = localStorage.getItem(rsvpKey);
                
                card.innerHTML = `
                    <div class="event-header">
                        <h3>${escapeHtml(item.title)}</h3>
                        <span class="badge">📍 ${escapeHtml(item.type)}</span>
                    </div>

                    <div class="event-meta">
                        <span>📅 ${escapeHtml(item.dateStr)}</span>
                        <span>📍 ${escapeHtml(item.location)}</span>
                    </div>

                    <p style="font-size: 0.95rem; color: var(--text-muted); margin-top: 0.4rem;">
                        ${escapeHtml(item.description)}
                    </p>

                    <div class="event-actions">
                        <button class="btn-action ${userRsvp ? 'active' : ''}" onclick="toggleRsvpForm(${item.id})">
                            ${userRsvp ? '✓ RSVP Submitted' : '✍️ RSVP Now'}
                        </button>
                        <button class="btn-action" onclick="downloadICS('${escapeJs(item.title)}', '${escapeJs(item.dateStr)}', '${escapeJs(item.location)}', '${escapeJs(item.description)}')">
                            📅 Add to Calendar
                        </button>
                        ${adminLoggedIn ? `<button class="btn-delete" onclick="deleteEvent(${item.id})">Delete Event</button>` : ''}
                    </div>

                    <!-- RSVP Form Collapsible Section -->
                    <div class="rsvp-section" id="rsvp-section-${item.id}">
                        <h4 style="margin-bottom: 0.75rem; font-size: 1rem; color: var(--gold-light);">Contact Information for RSVP</h4>
                        ${userRsvp ? `
                            <p style="color: #34d399; font-size: 0.85rem; margin-bottom: 0.5rem;">✓ You have registered for this event with: ${escapeHtml(JSON.parse(userRsvp).email)}</p>
                        ` : ''}
                        <form onsubmit="handleRSVPSubmit(event, ${item.id})">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" id="rsvp-name-${item.id}" placeholder="e.g. John Doe" required>
                            </div>
                            <div class="grid-2-form">
                                <div class="form-group">
                                    <label>Email Address</label>
                                    <input type="email" id="rsvp-email-${item.id}" placeholder="john@example.com" required>
                                </div>
                                <div class="form-group">
                                    <label>Phone Number</label>
                                    <input type="tel" id="rsvp-phone-${item.id}" placeholder="(555) 000-0000" required>
                                </div>
                            </div>
                            <button type="submit" class="btn-submit" style="margin-top: 0.5rem;">Confirm RSVP</button>
                        </form>
                    </div>
                `;
                feed.appendChild(card);
            });

            document.getElementById('adminPanel').style.display = adminLoggedIn ? 'block' : 'none';
            document.getElementById('adminAuthBtn').innerText = adminLoggedIn ? '🔒 Log Out of Admin Mode' : '🔑 Admin Access (Post Events)';
        }

        function toggleRsvpForm(eventId) {
            const targetSection = document.getElementById(`rsvp-section-${eventId}`);
            targetSection.classList.toggle('open');
        }

        function handleRSVPSubmit(event, eventId) {
            event.preventDefault();
            const name = document.getElementById(`rsvp-name-${eventId}`).value.trim();
            const email = document.getElementById(`rsvp-email-${eventId}`).value.trim();
            const phone = document.getElementById(`rsvp-phone-${eventId}`).value.trim();

            const rsvpData = { name, email, phone, timestamp: new Date().toISOString() };
            localStorage.setItem(`cys_rsvp_${eventId}`, JSON.stringify(rsvpData));

            alert(`Thank you, ${name}! Your RSVP has been recorded.`);
            renderEvents();
        }

        function toggleAdminPrompt() {
            if (isAdmin()) {
                localStorage.setItem('cys_admin_logged_in', 'false');
                alert('Logged out of Admin Mode.');
            } else {
                const input = prompt('Enter Admin Passcode to post events:');
                if (input === ADMIN_PASSCODE) {
                    localStorage.setItem('cys_admin_logged_in', 'true');
                    alert('Access Granted! You can now post and manage events.');
                } else if (input !== null) {
                    alert('Incorrect passcode.');
                }
            }
            renderEvents();
        }

        function handleCreateEvent(event) {
            event.preventDefault();
            if (!isAdmin()) return;

            const events = getEvents();
            const newEvent = {
                id: Date.now(),
                title: document.getElementById('titleInput').value.trim(),
                type: document.getElementById('typeInput').value.trim(),
                dateStr: document.getElementById('dateInput').value.trim(),
                location: document.getElementById('locationInput').value.trim(),
                description: document.getElementById('descInput').value.trim()
            };

            events.unshift(newEvent);
            saveEvents(events);

            document.getElementById('eventForm').reset();
            renderEvents();
        }

        function deleteEvent(id) {
            if (!isAdmin()) return;
            if (confirm('Are you sure you want to delete this event?')) {
                let events = getEvents().filter(e => e.id !== id);
                saveEvents(events);
                renderEvents();
            }
        }

        function downloadICS(title, dateStr, location, desc) {
            const icsContent = 
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Catholic Youth Society//Event Calendar//EN
BEGIN:VEVENT
SUMMARY:${title}
DESCRIPTION:${desc}
LOCATION:${location}
COMMENT:Scheduled for ${dateStr}
END:VEVENT
END:VCALENDAR`;

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', `${title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.ics`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
        function escapeJs(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        renderEvents();
    </script>

</body>
</html>
