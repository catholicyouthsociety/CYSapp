<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events & Calendar - Catholic Youth Society</title>
    <style>
        :root {
            --navy-dark: #080d1a;
            --navy-card: #121b2d;
            --navy-accent: #1e2d4a;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --text-white: #ffffff;
            --text-muted: #8c9ba5;
            --border-gold: rgba(212, 175, 55, 0.25);
            --tag-virtual: #2563eb;
            --tag-inperson: #059669;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            color: var(--text-white);
            background-color: var(--navy-dark);
            line-height: 1.6;
            padding-bottom: 5rem;
        }

        .container {
            padding: 2rem 5%;
            max-width: 900px;
            margin: 0 auto;
        }

        .section-title {
            color: var(--gold-primary);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        h1, h2, h3 {
            font-family: Georgia, serif;
            color: var(--text-white);
        }

        .card {
            background-color: var(--navy-card);
            border: 1px solid var(--border-gold);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        /* Event Card Styles */
        .event-card {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            position: relative;
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-virtual {
            background-color: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(37, 99, 235, 0.4);
        }

        .badge-inperson {
            background-color: rgba(5, 150, 105, 0.2);
            color: #34d399;
            border: 1px solid rgba(5, 150, 105, 0.4);
        }

        .event-meta {
            font-size: 0.85rem;
            color: var(--gold-light);
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 0.25rem;
        }

        .event-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 0.5rem;
        }

        .btn-sync {
            background: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-sync:hover {
            background: var(--gold-primary);
            color: var(--navy-dark);
        }

        .btn-delete {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 0.3rem 0.7rem;
            border-radius: 12px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        /* Form Controls */
        .admin-panel {
            display: none; /* Hidden by default for regular users */
            border-left: 4px solid var(--gold-primary);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--gold-light);
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            background-color: rgba(8, 13, 26, 0.6);
            border: 1px solid var(--border-gold);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-white);
            font-size: 0.95rem;
            outline: none;
        }

        .grid-2-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn-submit {
            background-color: var(--gold-primary);
            color: var(--navy-dark);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
        }

        .admin-toggle-link {
            display: block;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-decoration: none;
            margin-top: 3rem;
            cursor: pointer;
        }

        /* Bottom Nav Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--navy-card);
            border-top: 1px solid var(--border-gold);
            display: flex;
            justify-content: space-around;
            padding: 0.6rem 0;
            z-index: 1000;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.5);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .nav-item .nav-icon {
            font-size: 1.25rem;
            margin-bottom: 0.15rem;
        }

        .nav-item.active,
        .nav-item:hover {
            color: var(--gold-primary);
        }

        @media (max-width: 600px) {
            .grid-2-form { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <main class="container">

        <div style="margin-bottom: 1.5rem;">
            <div class="section-title">Schedule & Gatherings</div>
            <h1 style="font-size: 2rem;">Upcoming Events</h1>
            <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem;">
                Join our Bible studies, virtual prayer sessions, and youth game nights.
            </p>
        </div>

        <!-- Admin Event Creation Panel (Hidden unless unlocked) -->
        <div class="card admin-panel" id="adminPanel">
            <div class="section-title">Admin Controls</div>
            <h3 style="margin-bottom: 1rem;">Post New Event</h3>

            <form id="eventForm" onsubmit="handleCreateEvent(event)">
                <div class="form-group">
                    <label for="titleInput">Event Title</label>
                    <input type="text" id="titleInput" placeholder="e.g., Youth Game Night & Fellowship" required>
                </div>

                <div class="grid-2-form">
                    <div class="form-group">
                        <label for="typeInput">Event Type</label>
                        <select id="typeInput">
                            <option value="virtual">Virtual (Zoom/Discord)</option>
                            <option value="in-person">In-Person</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="dateInput">Date & Time</label>
                        <input type="text" id="dateInput" placeholder="e.g., Friday, Sept 18 • 7:00 PM EST" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="locationInput">Location / Meeting Link</label>
                    <input type="text" id="locationInput" placeholder="e.g., Parish Youth Center or Zoom Link" required>
                </div>

                <div class="form-group">
                    <label for="descInput">Event Details</label>
                    <textarea id="descInput" rows="3" placeholder="Brief description of the event..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Publish Event</button>
            </form>
        </div>

        <!-- Public Events Feed -->
        <div class="section-title">Calendar Feed</div>
        <div id="eventsFeed">
            <!-- Rendered dynamically -->
        </div>

        <!-- Footer Admin Trigger -->
        <a class="admin-toggle-link" id="adminAuthBtn" onclick="toggleAdminPrompt()">🔑 Admin Access (Post Events)</a>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="daily-prayer.html" class="nav-item">
            <span class="nav-icon">📖</span>
            <span>Prayers</span>
        </a>
        <a href="prayer-wall.html" class="nav-item">
            <span class="nav-icon">🙏</span>
            <span>Prayer Wall</span>
        </a>
        <a href="events.html" class="nav-item active">
            <span class="nav-icon">📅</span>
            <span>Events</span>
        </a>
    </nav>

    <script>
        // Master Admin Passcode
        const ADMIN_PASSCODE = "722005";

        // Default events seed data
        const defaultEvents = [
            {
                id: 1,
                title: "National Youth Virtual Rosary",
                type: "virtual",
                dateStr: "Friday, Sept 11 • 8:00 PM EST",
                location: "Zoom ID: 842 1920 4410",
                description: "Join youth from across the country for our weekly online Rosary and small group discussion."
            },
            {
                id: 2,
                title: "Game Night & Pizza Social",
                type: "in-person",
                dateStr: "Saturday, Sept 19 • 6:00 PM EST",
                location: "St. Joseph Youth Center Hall",
                description: "Board games, multiplayer video games, and free pizza! Bring a friend along."
            },
            {
                id: 3,
                title: "Gospel Bible Study: Gospel of Mark",
                type: "virtual",
                dateStr: "Wednesday, Sept 23 • 7:30 PM EST",
                location: "Discord Voice Channel",
                description: "An interactive scripture study focusing on discipleship and faith in action."
            }
        ];

        // Retrieve stored events or initialize default list
        function getEvents() {
            const stored = localStorage.getItem('cys_events');
            if (!stored) {
                localStorage.setItem('cys_events', JSON.stringify(defaultEvents));
                return defaultEvents;
            }
            return JSON.parse(stored);
        }

        function saveEvents(events) {
            localStorage.setItem('cys_events', JSON.stringify(events));
        }

        // Check if current device has unlocked Admin status
        function isAdmin() {
            return localStorage.getItem('cys_admin_logged_in') === 'true';
        }

        // Render Events Feed
        function renderEvents() {
            const events = getEvents();
            const feed = document.getElementById('eventsFeed');
            const adminLoggedIn = isAdmin();
            
            feed.innerHTML = '';

            events.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card event-card';
                card.innerHTML = `
                    <div class="event-header">
                        <h3>${escapeHtml(item.title)}</h3>
                        <span class="badge ${item.type === 'virtual' ? 'badge-virtual' : 'badge-inperson'}">
                            ${item.type === 'virtual' ? '🌐 Virtual' : '📍 In-Person'}
                        </span>
                    </div>

                    <div class="event-meta">
                        <span>📅 ${escapeHtml(item.dateStr)}</span>
                        <span>📍 ${escapeHtml(item.location)}</span>
                    </div>

                    <p style="font-size: 0.95rem; color: var(--text-muted); margin-top: 0.4rem;">
                        ${escapeHtml(item.description)}
                    </p>

                    <div class="event-actions">
                        <button class="btn-sync" onclick="downloadICS('${escapeJs(item.title)}', '${escapeJs(item.dateStr)}', '${escapeJs(item.location)}', '${escapeJs(item.description)}')">
                            📅 Add to Calendar
                        </button>
                        ${adminLoggedIn ? `<button class="btn-delete" onclick="deleteEvent(${item.id})">Delete Event</button>` : ''}
                    </div>
                `;
                feed.appendChild(card);
            });

            // Toggle admin panel visibility
            document.getElementById('adminPanel').style.display = adminLoggedIn ? 'block' : 'none';
            document.getElementById('adminAuthBtn').innerText = adminLoggedIn ? '🔒 Log Out of Admin Mode' : '🔑 Admin Access (Post Events)';
        }

        // Handle Admin Authentication
        function toggleAdminPrompt() {
            if (isAdmin()) {
                localStorage.setItem('cys_admin_logged_in', 'false');
                alert('Logged out of Admin Mode.');
            } else {
                const input = prompt('Enter Admin Passcode to post events:');
                if (input === ADMIN_PASSCODE) {
                    localStorage.setItem('cys_admin_logged_in', 'true');
                    alert('Access Granted! You can now post and manage events.');
                } else if (input !== null) {
                    alert('Incorrect passcode.');
                }
            }
            renderEvents();
        }

        // Event Creation (Admin Only)
        function handleCreateEvent(event) {
            event.preventDefault();
            if (!isAdmin()) return;

            const events = getEvents();
            const newEvent = {
                id: Date.now(),
                title: document.getElementById('titleInput').value.trim(),
                type: document.getElementById('typeInput').value,
                dateStr: document.getElementById('dateInput').value.trim(),
                location: document.getElementById('locationInput').value.trim(),
                description: document.getElementById('descInput').value.trim()
            };

            events.unshift(newEvent);
            saveEvents(events);

            // Reset form fields
            document.getElementById('eventForm').reset();
            renderEvents();
        }

        // Delete Event (Admin Only)
        function deleteEvent(id) {
            if (!isAdmin()) return;
            if (confirm('Are you sure you want to delete this event?')) {
                let events = getEvents().filter(e => e.id !== id);
                saveEvents(events);
                renderEvents();
            }
        }

        // Generate and download .ics calendar file
        function downloadICS(title, dateStr, location, desc) {
            const icsContent = 
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Catholic Youth Society//Event Calendar//EN
BEGIN:VEVENT
SUMMARY:${title}
DESCRIPTION:${desc}
LOCATION:${location}
COMMENT:Scheduled for ${dateStr}
END:VEVENT
END:VCALENDAR`;

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', `${title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.ics`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // XSS Helper functions
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
        function escapeJs(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        // Initialize page
        renderEvents();
    </script>

</body>
</html>
